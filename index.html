<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Simmu ❤️</title>
    <style>
        body {
            background-color: #fff0f3;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 75, 110, 0.2);
            max-width: 500px;
            position: relative;
        }

        h1 {
            color: #ff4d6d;
            font-size: 2.5rem;
        }

        p {
            color: #590d22;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #noBtn {
            background-color: #800f2f;
            color: white;
            position: relative;
        }

        #message {
            display: none;
            margin-top: 20px;
            font-size: 1.5rem;
            color: #ff4d6d;
            font-weight: bold;
            animation: fadeIn 1s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .hearts {
            color: #ff4d6d;
            font-size: 2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hearts">❤️❤️❤️</div>
        <h1>Hey Simran...</h1>
        <div id="content-box">
            <p>
                My dearest Simmu, I am truly sorry for what happened. 
                You mean the world to me, and my days aren't as bright when we aren't okay. 
                I never want to be the reason for your sadness.
            </p>
            <p><strong>Do you forgive me?</strong></p>
            
            <div class="buttons">
                <button id="yesBtn" onclick="forgive()">Yes</button>
                <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
            </div>
        </div>

        <div id="message">
            I lovee youuu moreeee simmmuuu 💖✨
            <br>
            <small style="font-size: 0.8rem; font-weight: normal;">— Yours, Aditya</small>
        </div>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            // Calculate random positions within the screen
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function forgive() {
            document.getElementById('content-box').style.display = 'none';
            document.getElementById('message').style.display = 'block';
            document.querySelector('.hearts').innerHTML = '💖💖💖';
        }
    </script>
</body>
</html>
